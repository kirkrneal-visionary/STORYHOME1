<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Story Home</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d11;
        color: #f4f1e8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: calc(env(safe-area-inset-top) + 24px) 32px calc(env(safe-area-inset-bottom) + 24px);
        text-align: center;
      }
      .wordmark { font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-size: 28px; }
      .wordmark .home { color: #f5b71e; }
      h1 { margin: 8px 0 0; font-size: 20px; font-weight: 600; }
      p { margin: 0; max-width: 320px; color: rgba(247, 244, 236, 0.64); font-size: 16px; line-height: 1.45; }
      button {
        margin-top: 8px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #f5b71e;
        color: #17335e;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
      }
      button:disabled { opacity: 0.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark" aria-label="Story Home"><span>STORY</span><span class="home">HOME</span></div>
      <h1 id="offline-title">You're offline</h1>
      <p>Story Home needs the internet. Check Wi-Fi or cellular, then try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      (function () {
        var button = document.getElementById("retry");
        function retry() {
          var shell = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StoryHomeShell;
          if (!shell) return;
          button.disabled = true;
          shell.retry().catch(function () {
            button.disabled = false;
          });
        }
        button.addEventListener("click", retry);
        window.addEventListener("online", retry);
      })();
    </script>
  </body>
</html>
