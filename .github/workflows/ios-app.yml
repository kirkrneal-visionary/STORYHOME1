# iPhone app shell (mobile/). Builds on GitHub's macOS runners; no Mac needed.
# - Pull requests touching mobile/: simulator build + smoke test, and an unsigned device archive.
# - TestFlight upload: manual run, a push to main touching mobile/, or an `ios-testflight-*` tag.
#   It needs the repository secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID,
#   and skips with a notice until they exist. Signing is cloud-managed by Apple through the
#   API key; no certificate or profile is ever stored in this repo.
name: iPhone app

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app.yml"
    tags:
      - "ios-testflight-*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  simulator:
    name: Simulator build and smoke test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build
      - name: Smoke test in the simulator
        run: |
          bash scripts/ci-simulator-smoke.sh \
            "$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/smoke"
      - name: Archive for devices (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App-unsigned.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    if: github.event_name != 'pull_request'
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check Apple secrets
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight upload skipped: Apple secrets are not set yet."
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci && npx cap sync ios
      - name: Write the API key to a temp file
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Register bundle ID and check the app record
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          "$RUNNER_TEMP/venv/bin/python" scripts/asc-prepare.py ios/App/App/capacitor.config.json
      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Sign with cloud-managed certificate and upload
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
        working-directory: .
