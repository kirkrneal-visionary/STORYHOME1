# Isolated contract checks. Does not use production secrets.
# GitHub check run name: verify
# This workflow RUNS on push/PR. Merge-blocking only if main requires "verify".
name: Project memory checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolated workflow contracts
        run: npm run test:project-memory
