# Wave L4: refresh launch-county CAD parcels on a 24h cadence.
# Each county only re-ingests when its last success is older than 72h
# (see scripts/refresh-cad.mjs + cad_county_status.refresh_interval_hours).
name: CAD 72h refresh

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force refresh even if within 72h window"
        required: false
        default: "false"
        type: boolean

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require Supabase secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ok=1
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::GitHub secret NEXT_PUBLIC_SUPABASE_URL is missing or empty."
            echo "Add it at: Settings → Secrets and variables → Actions"
            echo "Value must be https://YOURPROJECT.supabase.co  (NO /rest/v1/)"
            ok=0
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            */rest/v1|*/rest/v1/)
              echo "::error::NEXT_PUBLIC_SUPABASE_URL must NOT end with /rest/v1/"
              echo "Use only: https://YOURPROJECT.supabase.co"
              ok=0
              ;;
          esac
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::GitHub secret SUPABASE_SERVICE_ROLE_KEY is missing or empty."
            ok=0
          fi
          if [ "$ok" != "1" ]; then
            exit 1
          fi
          echo "Supabase URL present (length ${#NEXT_PUBLIC_SUPABASE_URL})"
          echo "Service role key present (length ${#SUPABASE_SERVICE_ROLE_KEY})"
      - name: Refresh stale CAD counties
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Running CAD refresh from commit $GITHUB_SHA"
          FORCE="${{ github.event.inputs.force }}"
          FORCE="$(echo "$FORCE" | tr '[:upper:]' '[:lower:]')"
          # Default: only stale / never-succeeded counties.
          # force=true re-ingests all 7 (use sparingly — long run).
          if [ "$FORCE" = "true" ]; then
            node scripts/refresh-cad.mjs --force
          else
            node scripts/refresh-cad.mjs
          fi
